name: Watch Giselle Tickets

on:
  schedule:
    # Every 30 minutes (at :07 and :37, offset from the busy :00/:30 marks
    # to reduce queueing delay), but only during 06:00-20:59 UTC, which is
    # 09:00-23:59 Vilnius time (UTC+3 in summer / EEST). This skips the
    # 00:00-09:00 local "night" window.
    # NOTE: UTC doesn't shift for daylight saving. When Lithuania switches
    # to EET (UTC+2) in late October, this window will drift an hour
    # later locally (effectively 10:00-00:59) until you update it back.
    - cron: '7,37 6-20 * * *'
  workflow_dispatch:
    inputs:
      always_notify:
        description: 'Send a message on every check (even "no seats found")'
        type: boolean
        default: false

permissions:
  contents: write   # needed so the workflow can commit last_state.json back

concurrency:
  group: watch-giselle
  cancel-in-progress: false   # never kill a run mid-check; queue instead

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip and Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium for Playwright
        run: playwright install --with-deps chromium

      - name: Run ticket check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Checked box on a manual "Run workflow" click wins. Otherwise falls
          # back to the ALWAYS_NOTIFY repo variable (used on scheduled runs).
          ALWAYS_NOTIFY: ${{ github.event.inputs.always_notify || vars.ALWAYS_NOTIFY || 'false' }}
        run: python watch_giselle.py --once

      - name: Persist state back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_state.json
          git diff --staged --quiet || git commit -m "Update seat-check state"
          git push
